<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obstacle Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Obstacle Generator</h1>
    <div class="layout">
      <form id="controls">
        <div class="top">
          <label class="field">
            <span>Algorithm</span>
            <select id="algorithm"></select>
          </label>
          <!-- The default and maximum match defaultEdgeLength and maxEdgeLength in server.go. -->
          <label class="field" title="Hexes along each side of the board">
            <span>Edge length</span>
            <input id="edge" type="number" min="1" max="15" step="1" value="6" required>
          </label>
          <label class="field">
            <span>Seed</span>
            <input id="seed" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="random" autocomplete="off">
          </label>
        </div>
        <div class="actions">
          <button type="submit">Generate</button>
          <button type="button" id="reset" class="secondary">Reset parameters</button>
        </div>
        <div class="actions">
          <span class="actions-label">Settings</span>
          <button type="button" id="copy-settings" class="secondary small" title="Copy the settings behind the board shown to the clipboard, as JSON" disabled>Copy</button>
          <button type="button" id="save-settings" class="secondary small" title="Save the settings behind the board shown as a .json file" disabled>Save</button>
          <button type="button" id="load-settings" class="secondary small" title="Apply settings from JSON, pasted or from a saved file">Load…</button>
        </div>
        <div id="params"></div>
      </form>
      <section class="output">
        <p id="status" role="status"></p>
        <div class="stepper">
          <button type="button" id="first" class="icon secondary" title="Empty board" aria-label="Empty board">«</button>
          <button type="button" id="prev" class="icon secondary" title="Previous obstacle (←)" aria-label="Previous obstacle">‹</button>
          <input type="range" id="frame" min="0" max="0" value="0" aria-label="Placement step">
          <button type="button" id="next" class="icon secondary" title="Next obstacle (→)" aria-label="Next obstacle">›</button>
          <button type="button" id="last" class="icon secondary" title="Final board" aria-label="Final board">»</button>
        </div>
        <div class="frame-info">
          <span id="frame-label"></span>
          <div class="frame-tools">
            <label class="metric">
              <span>Heatmap</span>
              <select id="metric"></select>
            </label>
            <button type="button" id="copy-image" class="secondary small" title="Copy the board as shown to the clipboard, as a PNG image" disabled>Copy image</button>
          </div>
        </div>
        <svg id="board" role="img" aria-label="Hex board"></svg>
        <div id="legend" class="legend"></div>
        <p id="cell-info" class="cell-info"></p>
      </section>
    </div>
  </main>
  <dialog id="load-dialog" aria-labelledby="load-title">
    <h2 id="load-title">Load settings</h2>
    <p class="description">Paste settings copied from this page, or open a saved <code>.json</code> file. Parameters left out take their defaults.</p>
    <textarea id="settings-text" rows="14" spellcheck="false" autocomplete="off" aria-label="Settings JSON"
      placeholder='{"algorithm": "triple_beta", "edge": 6, "params": {"k_obstacles": 16}}'></textarea>
    <p id="load-message" class="load-message" role="status"></p>
    <div class="dialog-actions">
      <button type="button" id="open-settings" class="secondary">Open file…</button>
      <input type="file" id="settings-file" accept=".json,application/json" hidden>
      <button type="button" id="cancel-load" class="secondary push">Cancel</button>
      <button type="button" id="apply-settings">Apply</button>
    </div>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
