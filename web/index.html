<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obstacle Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Obstacle Generator</h1>
    <div class="layout">
      <form id="controls">
        <div class="top">
          <label class="field">
            <span>Algorithm</span>
            <select id="algorithm"></select>
          </label>
          <label class="field">
            <span>Seed</span>
            <input id="seed" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="random" autocomplete="off">
          </label>
        </div>
        <div class="actions">
          <button type="submit">Generate</button>
          <button type="button" id="reset" class="secondary">Reset parameters</button>
        </div>
        <div id="params"></div>
      </form>
      <section class="output">
        <p id="status" role="status"></p>
        <svg id="board" role="img" aria-label="Hex board"></svg>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
